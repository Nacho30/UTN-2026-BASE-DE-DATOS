# pg_hba.conf del entorno de DESARROLLO de Food Store (Parte B)
# TYPE  DATABASE      USER      ADDRESS         METHOD
# El superusuario sólo por socket local y con identidad del sistema operativo
local   all           postgres                  peer
# Los roles de la aplicación siempre con contraseña (SCRAM), nunca trust
local   foodstore_u5  all                       scram-sha-256
host    foodstore_u5  all       127.0.0.1/32    scram-sha-256
host    foodstore_u5  all       ::1/128         scram-sha-256
# Cualquier otra combinación se rechaza explícitamente
host    all           all       0.0.0.0/0       reject
