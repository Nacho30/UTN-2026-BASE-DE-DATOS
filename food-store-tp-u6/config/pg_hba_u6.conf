# Líneas agregadas a pg_hba.conf para la Unidad 6 (antes de la regla final "reject").
# El respaldo y la restauración se conectan por TCP (-h localhost) con contraseña
# SCRAM leída de ~/.pgpass (modo 0600). La contraseña nunca va en los scripts.
# Se incluye la base "postgres" porque createdb/dropdb se conectan a ella.
host    foodstore,foodstore_restore_test,postgres  postgres  127.0.0.1/32  scram-sha-256
host    foodstore,foodstore_restore_test,postgres  postgres  ::1/128       scram-sha-256
